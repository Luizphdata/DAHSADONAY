name: CI
on: [push, pull_request]
# Este workflow apenas le o codigo e roda build/lint/test: nao abre PR, nao comenta,
# nao publica. Sem este bloco o GITHUB_TOKEN herdaria a permissao default do
# repositorio, que e mais ampla do que o necessario.
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
